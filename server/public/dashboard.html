<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSSS Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5f6b7a; --border: #dde1e6;
    --accent: #2563eb; --accent-text: #ffffff; --danger: #c62828; --ok: #2e7d32; --hover: #eef2f7;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #94a0b0; --border: #2a313b;
      --accent: #4f8cff; --accent-text: #0b0d10; --danger: #ef6b6b; --ok: #5cc06a; --hover: #1f252d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header form { display: flex; gap: 8px; flex: 1; min-width: 260px; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  input { flex: 1; min-width: 0; }
  button { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  #who { color: var(--muted); }
  main { display: grid; grid-template-columns: 220px 300px 1fr; gap: 1px; background: var(--border); min-height: calc(100vh - 58px); }
  section { background: var(--panel); padding: 12px; overflow: auto; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li button { width: 100%; text-align: left; border: 0; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; overflow: hidden; }
  li button span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li button.active { background: var(--hover); font-weight: 600; }
  .count { color: var(--muted); }
  .row { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 360px; font: 13px/1.5 var(--mono); resize: vertical; }
  .meta { color: var(--muted); font-size: 13px; margin-bottom: 8px; word-break: break-all; }
  .key-name { font: 600 15px var(--mono); word-break: break-all; margin-bottom: 4px; }
  #status { min-height: 20px; margin-top: 8px; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  .empty { color: var(--muted); padding: 8px 0; }
  .history li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .history li:last-child { border-bottom: 0; }
  .history .current { color: var(--ok); font-weight: 600; }
  .history .removed { color: var(--danger); }
  pre { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; max-height: 240px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .lock { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    textarea { min-height: 240px; }
  }
</style>
</head>
<body>
<header>
  <h1>OSSS Dashboard</h1>
  <form id="login">
    <input id="api-key" type="password" placeholder="API key" autocomplete="off" aria-label="API key">
    <button class="primary" type="submit">Connect</button>
  </form>
  <span id="who"></span>
</header>
<main>
  <section>
    <h2>Stores</h2>
    <ul id="stores"><li class="empty">Connect with an API key to see your stores.</li></ul>
  </section>
  <section>
    <h2>Keys</h2>
    <div class="row">
      <input id="prefix" placeholder="Filter by prefix" aria-label="Filter keys by prefix" disabled>
    </div>
    <ul id="keys"><li class="empty">Pick a store.</li></ul>
    <div class="row" style="margin-top:8px"><button id="more" hidden>Load more</button></div>
  </section>
  <section>
    <h2>Value</h2>
    <div id="editor" hidden>
      <div class="key-name" id="key-name"></div>
      <div class="meta" id="key-meta"></div>
      <div id="lock-box"></div>
      <textarea id="value" spellcheck="false" aria-label="Value as JSON"></textarea>
      <div class="row" style="margin-top:8px">
        <button class="primary" id="save">Save</button>
        <button id="reload">Reload</button>
        <button class="danger" id="delete">Delete</button>
      </div>
      <h2 style="margin-top:20px">History</h2>
      <ul id="history" class="history"></ul>
      <div id="preview" hidden>
        <div class="meta" id="preview-meta"></div>
        <pre id="preview-value"></pre>
        <div class="row">
          <button class="primary" id="restore">Restore this version</button>
          <button id="close-preview">Close</button>
        </div>
      </div>
    </div>
    <div id="no-key" class="empty">Pick a key to view or edit it.</div>
    <div class="row" style="margin-top:16px">
      <input id="new-key" placeholder="New key name" aria-label="New key name" disabled>
      <button id="create" disabled>Create key</button>
    </div>
    <div id="status" role="status"></div>
  </section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const enc = encodeURIComponent;
const state = { apiKey: "", store: null, key: null, version: 0, cursor: null, previewId: null };

function remember(value) {
  try { sessionStorage.setItem("osss-key", value); } catch {}
}
function recall() {
  try { return sessionStorage.getItem("osss-key") || ""; } catch { return ""; }
}

function setStatus(text, kind) {
  const el = $("status");
  el.textContent = text;
  el.className = kind || "";
}

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { Authorization: "Bearer " + state.apiKey, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.message || res.statusText);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function item(label, extra, active, onClick) {
  const li = document.createElement("li");
  const button = document.createElement("button");
  const name = document.createElement("span");
  name.textContent = label;
  name.title = label;
  button.append(name);
  if (extra !== null) {
    const count = document.createElement("span");
    count.className = "count";
    count.textContent = extra;
    button.append(count);
  }
  if (active) button.classList.add("active");
  button.addEventListener("click", onClick);
  li.append(button);
  return li;
}

function emptyItem(text) {
  const li = document.createElement("li");
  li.className = "empty";
  li.textContent = text;
  return li;
}

async function connect(apiKey) {
  state.apiKey = apiKey;
  try {
    const me = await api("GET", "/v1/whoami");
    $("who").textContent = `Signed in as ${me.name} (${me.access})`;
    remember(apiKey);
    $("prefix").disabled = false;
    setStatus("");
    await loadStores();
  } catch (err) {
    $("who").textContent = "";
    setStatus(err.status === 401 ? "That API key wasn't accepted." : err.message, "error");
  }
}

async function loadStores() {
  const { stores } = await api("GET", "/v1/stores");
  const list = $("stores");
  list.replaceChildren(...(stores.length
    ? stores.map((s) => item(s.name, String(s.keys), s.name === state.store, () => openStore(s.name)))
    : [emptyItem("No stores yet. Create a key to start one.")]));
  $("new-key").disabled = false;
  $("create").disabled = false;
}

async function openStore(name) {
  state.store = name;
  state.cursor = null;
  closeKey();
  await loadStores();
  await loadKeys(false);
}

async function loadKeys(append) {
  if (!state.store) return;
  const params = new URLSearchParams({ prefix: $("prefix").value, limit: "50" });
  if (append && state.cursor) params.set("cursor", state.cursor);
  const data = await api("GET", `/v1/stores/${enc(state.store)}/keys?${params}`);
  const list = $("keys");
  const items = data.keys.map((k) => item(k, null, k === state.key, () => openKey(k)));
  if (append) list.append(...items);
  else list.replaceChildren(...(items.length ? items : [emptyItem("No keys match.")]));
  state.cursor = data.nextCursor;
  $("more").hidden = !data.nextCursor;
}

function closeKey() {
  state.key = null;
  $("editor").hidden = true;
  $("no-key").hidden = false;
}

async function openKey(key) {
  state.key = key;
  setStatus("");
  for (const button of $("keys").querySelectorAll("button")) {
    button.classList.toggle("active", button.firstChild.textContent === key);
  }
  try {
    const path = `/v1/stores/${enc(state.store)}/keys/${enc(key)}`;
    const [entry, lockInfo] = await Promise.all([api("GET", path), api("GET", path + "/lock")]);
    state.version = entry.version;
    $("key-name").textContent = key;
    $("key-meta").textContent = `Store ${state.store} · version ${entry.version} · updated ${new Date(entry.updatedAt).toLocaleString()}`;
    $("value").value = JSON.stringify(entry.value, null, 2);
    showLock(lockInfo.lock);
    $("editor").hidden = false;
    $("no-key").hidden = true;
    closePreview();
    await loadHistory();
  } catch (err) {
    setStatus(err.message, "error");
  }
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
  return (bytes / 1024 / 1024).toFixed(1) + " MB";
}

async function loadHistory() {
  const { versions } = await api("GET", `/v1/stores/${enc(state.store)}/keys/${enc(state.key)}/history?limit=20`);
  const list = $("history");
  list.replaceChildren(...versions.map((v, i) => {
    const li = document.createElement("li");
    const text = document.createElement("span");
    const when = new Date(v.updatedAt).toLocaleString();
    if (v.op === "remove") {
      text.className = "removed";
      text.textContent = `Deleted (was v${v.version}) · ${when}`;
    } else {
      text.textContent = `v${v.version} · ${when} · ${formatSize(v.size)}` + (v.author ? ` · ${v.author}` : "");
      if (i === 0 && v.version === state.version) text.classList.add("current");
    }
    li.append(text);
    if (v.op === "set") {
      const view = document.createElement("button");
      view.textContent = i === 0 && v.version === state.version ? "Current" : "View";
      view.disabled = i === 0 && v.version === state.version;
      view.addEventListener("click", () => showVersion(v.id));
      li.append(view);
    }
    return li;
  }));
  if (versions.length === 0) list.replaceChildren(emptyItem("No history yet."));
}

async function showVersion(id) {
  try {
    const v = await api("GET", `/v1/stores/${enc(state.store)}/keys/${enc(state.key)}/history/${id}`);
    state.previewId = id;
    $("preview-meta").textContent = `Version ${v.version} from ${new Date(v.updatedAt).toLocaleString()}`;
    $("preview-value").textContent = JSON.stringify(v.value, null, 2);
    $("preview").hidden = false;
  } catch (err) {
    setStatus(err.message, "error");
  }
}

function closePreview() {
  state.previewId = null;
  $("preview").hidden = true;
}

async function restoreVersion() {
  if (!state.previewId) return;
  if (!confirm("Restore this version? It's saved as a new version, so you can undo it the same way.")) return;
  try {
    await api("POST", `/v1/stores/${enc(state.store)}/keys/${enc(state.key)}/restore`, { id: state.previewId, ifVersion: state.version });
    await openKey(state.key);
    setStatus("Restored.", "ok");
  } catch (err) {
    if (err.status === 409) setStatus("Someone changed this key since you opened it. Reload and try again.", "error");
    else setStatus(err.message, "error");
  }
}

function showLock(lock) {
  const box = $("lock-box");
  box.replaceChildren();
  if (!lock) return;
  const div = document.createElement("div");
  div.className = "lock";
  const text = document.createElement("span");
  text.textContent = `Locked by ${lock.owner} until ${new Date(lock.expiresAt).toLocaleTimeString()}. Saving here will fail until it's released.`;
  const button = document.createElement("button");
  button.className = "danger";
  button.textContent = "Force unlock";
  button.addEventListener("click", forceUnlock);
  div.append(text, button);
  box.append(div);
}

async function save() {
  let value;
  try {
    value = JSON.parse($("value").value);
  } catch (err) {
    setStatus("That isn't valid JSON: " + err.message, "error");
    return;
  }
  try {
    await api("PUT", `/v1/stores/${enc(state.store)}/keys/${enc(state.key)}`, { value, ifVersion: state.version });
    await openKey(state.key);
    setStatus("Saved.", "ok");
  } catch (err) {
    if (err.status === 409) setStatus("Someone changed this key since you opened it. Reload to see the latest value.", "error");
    else setStatus(err.message, "error");
  }
}

async function remove() {
  if (!confirm(`Delete "${state.key}" from ${state.store}? This can't be undone.`)) return;
  try {
    await api("DELETE", `/v1/stores/${enc(state.store)}/keys/${enc(state.key)}?ifVersion=${state.version}`);
    closeKey();
    await loadStores();
    await loadKeys(false);
    setStatus("Deleted.", "ok");
  } catch (err) {
    setStatus(err.message, "error");
  }
}

async function forceUnlock() {
  if (!confirm("Force unlock? If a game server is still using this key, it could overwrite your changes.")) return;
  try {
    await api("DELETE", `/v1/stores/${enc(state.store)}/keys/${enc(state.key)}/lock?force=true`);
    await openKey(state.key);
    setStatus("Lock removed.", "ok");
  } catch (err) {
    setStatus(err.message, "error");
  }
}

async function create() {
  const key = $("new-key").value.trim();
  if (!key) return;
  const store = state.store || prompt("Which store should the new key go in?");
  if (!store) return;
  try {
    await api("PUT", `/v1/stores/${enc(store)}/keys/${enc(key)}`, { value: {}, ifVersion: 0 });
    $("new-key").value = "";
    state.store = store;
    await loadStores();
    await loadKeys(false);
    await openKey(key);
    setStatus("Created. Edit the value and save.", "ok");
  } catch (err) {
    setStatus(err.status === 409 ? "That key already exists." : err.message, "error");
  }
}

$("login").addEventListener("submit", (event) => {
  event.preventDefault();
  connect($("api-key").value.trim());
});
let prefixTimer;
$("prefix").addEventListener("input", () => {
  clearTimeout(prefixTimer);
  prefixTimer = setTimeout(() => loadKeys(false).catch((err) => setStatus(err.message, "error")), 250);
});
$("more").addEventListener("click", () => loadKeys(true).catch((err) => setStatus(err.message, "error")));
$("save").addEventListener("click", save);
$("reload").addEventListener("click", () => openKey(state.key));
$("delete").addEventListener("click", remove);
$("create").addEventListener("click", create);
$("restore").addEventListener("click", restoreVersion);
$("close-preview").addEventListener("click", closePreview);

const saved = recall();
if (saved) {
  $("api-key").value = saved;
  connect(saved);
}
</script>
</body>
</html>
