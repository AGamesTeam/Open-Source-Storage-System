name: Feature request
description: Suggest something OSSS should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe your game or tool and the problem you're running into.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How you'd like it to work, if you have an idea.
  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: With Roblox DataStores or anything else.
